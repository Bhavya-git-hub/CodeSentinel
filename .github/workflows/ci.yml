name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app/

      # The sandbox image's helper script lives outside the backend package but is still
      # ours, so it is held to the same standard.
      - run: ruff check ../sandbox/
      - run: ruff format --check ../sandbox/

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real PostgreSQL, Redis and Docker. The requires_db and requires_docker tests are
    # the acceptance evidence for the data model, the migrations and constraint C1, so
    # they must actually execute here -- a green run full of skips is not acceptance.
    # CODESENTINEL_REQUIRE_INTEGRATION=1 turns any such skip into a failure.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: codesentinel
          POSTGRES_PASSWORD: codesentinel
          POSTGRES_DB: codesentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codesentinel -d codesentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CODESENTINEL_ENVIRONMENT: ci
      CODESENTINEL_DATABASE_URL: postgresql+asyncpg://codesentinel:codesentinel@localhost:5432/codesentinel_test
      CODESENTINEL_TEST_DATABASE_URL: postgresql+asyncpg://codesentinel:codesentinel@localhost:5432/codesentinel_test
      CODESENTINEL_SANDBOX_IMAGE: codesentinel/analysis:ci
      CODESENTINEL_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build the analysis sandbox image
        # Required before the sandbox tests: the container has no network and cannot
        # pull, so the image has to exist on the runner first.
        working-directory: .
        run: docker build -f sandbox/Dockerfile.analysis -t codesentinel/analysis:ci sandbox/

      - name: Apply migrations
        run: alembic upgrade head

      - name: Record resolved dependency versions
        # The authoritative record of what was actually installed, resolved on the
        # deployment platform rather than on a developer's machine.
        run: pip freeze --exclude-editable > resolved-dependencies.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -rs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-record
          path: |
            backend/coverage.xml
            backend/resolved-dependencies.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # --run, never watch mode: vitest defaults to watching, which in CI is a job that
      # hangs until the runner times out rather than a job that fails.
      - run: npm run test -- --run
      - run: npm run build

  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Substitutes for the local `docker compose up` acceptance criterion, which could
      # not be run on the development machine (no Docker installed). This proves the
      # Dockerfiles and compose file are valid; it does not prove the stack runs.
      # See docs/adr/0005-deferred-docker-verification.md.
      - name: Validate compose file
        run: docker compose config --quiet

      - name: Validate the production overlay
        # The overlay uses `!override` to drop published ports and `${VAR:?}` to refuse
        # default credentials, and neither is exercised by the base file. Without this
        # step nothing checks the file we actually tell people to deploy with -- and a
        # Compose too old for `!override` would fail at deploy time instead of here.
        env:
          POSTGRES_PASSWORD: ci-validation-only
          CODESENTINEL_API_KEYS: ci-validation-only
          CODESENTINEL_CORS_ORIGINS: https://example.invalid
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          # Prove the overlay actually removes the published database port rather than
          # appending to it, which is what a plain `ports: []` would do.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config             | python -c "import sys,yaml; d=yaml.safe_load(sys.stdin);                 p=d['services']['postgres'].get('ports') or [];                 sys.exit(0 if not p else f'postgres still publishes {p}')"

      - name: Validate the TLS overlay
        # A separate file because a certificate needs a hostname that resolves here,
        # which no CI runner has. Validating it is still worth doing: the overlay uses
        # `!override` to unpublish the API and frontend ports, and an overlay that
        # appended instead would leave the plaintext API listening beside the encrypted
        # one with nothing in the application able to tell which route a caller took.
        env:
          POSTGRES_PASSWORD: ci-validation-only
          CODESENTINEL_API_KEYS: ci-validation-only
          CODESENTINEL_CORS_ORIGINS: https://example.invalid
          CODESENTINEL_DOMAIN: example.invalid
          CODESENTINEL_ACME_EMAIL: ops@example.invalid
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tls.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tls.yml config             | python -c "import sys,yaml; d=yaml.safe_load(sys.stdin);                 bad=[n for n in ('api','frontend') if d['services'][n].get('ports')];                 sys.exit(0 if not bad else f'{bad} still publish ports behind TLS')"

      - name: Refuse to start production without credentials
        # The failure mode this guards is a deployment that silently falls back to the
        # development password published in this repository.
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet 2>/dev/null; then
            echo "production overlay started without required credentials" >&2
            exit 1
          fi
          echo "correctly refused: required variables are unset"

      - name: Build images
        run: docker compose build

  smoke:
    name: Run the stack
    runs-on: ubuntu-latest
    # The acceptance criterion this project has carried unmet since phase 1. Every other
    # job proves the compose files are well-formed and the images build; none of them
    # proves the stack RUNS. ADR 0005 deferred this because the development machine has
    # no Docker daemon, and that is still true -- so it happens here or nowhere.
    steps:
      - uses: actions/checkout@v4

      - name: Build the analysis image the worker will start
        # The sandbox has no network and cannot pull, so the image must already exist on
        # the daemon. The worker reaches that same daemon through the socket proxy.
        run: docker build -f sandbox/Dockerfile.analysis -t codesentinel/analysis:0.1.0 sandbox/

      - name: Prepare the host clone directory
        # A bind mount, not a named volume: the worker asks the daemon to bind-mount each
        # clone into an analysis container, and the daemon resolves that path on the HOST.
        # It therefore has to exist on the host and be writable by the image's uid, which
        # a bind mount will not inherit from the image.
        run: |
          sudo mkdir -p /var/lib/codesentinel/clones
          sudo chown -R 10001:10001 /var/lib/codesentinel
          ls -ld /var/lib/codesentinel/clones

      - name: Start the stack
        # The proxy needs the host's docker gid to read the socket, and it now refuses to
        # start without it -- so this line is what keeps the stack from coming up broken.
        run: |
          CODESENTINEL_DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
          echo "docker socket gid: $CODESENTINEL_DOCKER_GID"
          echo "CODESENTINEL_DOCKER_GID=$CODESENTINEL_DOCKER_GID" >> "$GITHUB_ENV"
          CODESENTINEL_DOCKER_GID="$CODESENTINEL_DOCKER_GID"             docker compose up -d --build --wait --wait-timeout 300

      - name: The worker can actually reach the daemon through the proxy
        # Asserted directly, because every layer above this degrades politely: the worker
        # turns a broken proxy into "the sandbox was unavailable", the pipeline records
        # PARTIAL with that reason, and the report says every file is unmeasured. All
        # correct, and none of it says "the proxy cannot open the socket".
        run: |
          set -euo pipefail
          docker compose exec -T worker python -c "import docker; print(docker.from_env().version()['Version'])"

      - name: Show what came up
        run: docker compose ps

      - name: Apply migrations
        # Never automatic (two API replicas racing is a corruption risk), so the stack is
        # deliberately up and unmigrated until this runs.
        run: docker compose run --rm api alembic upgrade head

      - name: Readiness reports every dependency
        run: |
          set -euo pipefail
          body="$(curl -fsS http://localhost:8000/health/ready)"
          echo "$body"
          echo "$body" | python -c "import sys,json; d=json.load(sys.stdin);             assert d['status']=='ready', d;             assert d['dependencies']['database']['status']=='ok', d;             assert d['dependencies']['redis']['status']=='ok', d"

      - name: The frontend serves the SPA and proxies the API on one origin
        # Guards the nginx /api/ proxy. Without it a relative /api/v1/... request lands on
        # the SPA fallback and returns index.html with a 200, which surfaces as a JSON
        # parse error rather than as "the API is not reachable".
        run: |
          set -euo pipefail
          curl -fsS http://localhost:5173/ | grep -qi "<title>" || { echo "SPA did not serve"; exit 1; }
          listing="$(curl -fsS http://localhost:5173/api/v1/scans)"
          echo "$listing"
          echo "$listing" | python -c "import sys,json; d=json.load(sys.stdin);             assert 'scans' in d and 'total' in d, d"

      - name: A real scan runs end to end
        # The deepest thing here: it exercises the worker, the socket proxy's forwarding
        # layer (which DEPLOYMENT.md records as untested), and an analyser container
        # actually starting. A tiny repository, because the point is the path not the
        # payload.
        run: |
          set -euo pipefail
          scan_id="$(curl -fsS -X POST http://localhost:8000/api/v1/scans             -H 'Content-Type: application/json'             -d '{"url":"https://github.com/pallets/itsdangerous"}'             | python -c "import sys,json; print(json.load(sys.stdin)['scan_id'])")"
          echo "scan $scan_id"

          for _ in $(seq 1 90); do
            status="$(curl -fsS "http://localhost:8000/api/v1/scans/$scan_id"               | python -c "import sys,json; print(json.load(sys.stdin)['status'])")"
            echo "  status=$status"
            case "$status" in
              succeeded|partial|failed) break ;;
            esac
            sleep 5
          done

          detail="$(curl -fsS "http://localhost:8000/api/v1/scans/$scan_id")"
          echo "$detail"
          # PARTIAL is a pass: the sandbox has no network, so a target whose tests need
          # third-party packages cannot run them and coverage records SKIPPED with its
          # reason. FAILED is not, and neither is still running after seven minutes.
          echo "$detail" | python -c "import sys,json; d=json.load(sys.stdin);             assert d['status'] in ('succeeded','partial'), d;             assert d['file_count'] > 0, ('nothing was inventoried', d);             assert d['commit_count'] > 0, ('no history was mined', d)"

      - name: The analysers actually ran
        # The first version of this job did NOT check this, and passed a scan in which
        # every analyser had failed: 50 files inventoried, 50 unmeasured, 0 findings,
        # PARTIAL, green. That is the precise failure this whole project is built to
        # prevent -- a scan that finds nothing looking like a scan that found nothing
        # wrong -- reproduced in its own acceptance test.
        #
        # So the assertion is on files_ranked, not on the status. A status of PARTIAL is
        # compatible with total analyser failure; a non-zero count of ranked files is not.
        run: |
          set -euo pipefail
          id="$(curl -fsS 'http://localhost:8000/api/v1/scans?limit=1'             | python -c "import sys,json; print(json.load(sys.stdin)['scans'][0]['scan_id'])")"
          metrics="$(curl -fsS "http://localhost:8000/api/v1/scans/$id/metrics?limit=5")"
          python - "$metrics" <<'PYCHECK'
          import json, sys
          d = json.loads(sys.argv[1])
          statuses = d["analyzer_statuses"]
          print(json.dumps(statuses, indent=1))
          ranked = d["total_files"] - d["unmeasured"]
          print(f"ranked={ranked} of {d['total_files']}")

          # The measurement, not the status. A status of PARTIAL is compatible with every
          # analyser having failed, so it cannot carry this assertion; a non-zero count of
          # ranked files can only happen if Radon actually ran inside the sandbox.
          assert ranked > 0, (
              "every file came back unmeasured, so no analyser produced anything", d
          )

          # An analyser reporting that it could NOT run is a correct outcome, not a
          # failure: coverage drives the target's suite, the sandbox has no network, and a
          # target whose tests need third-party packages cannot install them (ADR 0009).
          # Demanding a clean status here would make the honest result a red build, and
          # would pressure the next person into weakening the skip instead.
          #
          # Only an explicit "failed" is a failure. Reasons print either way, so a skip is
          # never silent.
          broken = {k: v for k, v in statuses.items()
                    if isinstance(v, dict) and v.get("status") == "failed"}
          assert not broken, f"an analyser failed outright: {broken}"
          PYCHECK

      - name: The report states what it could not determine
        run: |
          set -euo pipefail
          id="$(curl -fsS 'http://localhost:8000/api/v1/scans?limit=1'             | python -c "import sys,json; print(json.load(sys.stdin)['scans'][0]['scan_id'])")"
          curl -fsS "http://localhost:8000/api/v1/scans/$id/report"             | python -c "import sys,json; d=json.load(sys.stdin);               print(json.dumps({k: d[k] for k in ('status','files_ranked','files_unmeasured','findings_total','findings_by_severity','dependency_edges','coverage_measured_files','commit_count')}, indent=1));               assert isinstance(d['limitations'], list), d;               assert d['config'], 'the reproducibility snapshot is empty (C5)'"

      - name: Logs
        if: always()
        # On failure this is the only account of what happened, and the reason a scan
        # failed lives in the worker's log rather than in any assertion above.
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  smoke-prod:
    name: Run the production stack
    runs-on: ubuntu-latest
    # The production and TLS overlays had never been started either. They are the files
    # an operator actually deploys with, and they carry everything the base stack does
    # not: real credentials, replica counts, the `!override` port removals, and a reverse
    # proxy terminating TLS. Validating them with `config` proves they parse.
    env:
      COMPOSE: -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tls.yml
      POSTGRES_PASSWORD: smoke-only-not-a-real-secret
      CODESENTINEL_API_KEYS: ci-smoke:smoke-only-not-a-real-secret
      CODESENTINEL_CORS_ORIGINS: https://localhost
      # Caddy issues from its own internal CA for `localhost` without contacting an ACME
      # server, so the real Caddyfile is exercised unmodified. What this does NOT cover is
      # public ACME issuance, which needs a hostname that resolves to the runner.
      CODESENTINEL_DOMAIN: localhost
      CODESENTINEL_ACME_EMAIL: ops@example.invalid
    steps:
      - uses: actions/checkout@v4

      - name: Build the analysis image the worker will start
        run: docker build -f sandbox/Dockerfile.analysis -t codesentinel/analysis:0.1.0 sandbox/

      - name: Prepare the host clone directory
        run: |
          sudo mkdir -p /var/lib/codesentinel/clones
          sudo chown -R 10001:10001 /var/lib/codesentinel

      - name: Refuse to start without credentials
        # The overlay uses ${VAR:?} so a deployment cannot fall back to the development
        # password published in this repository. Asserted against the real `up`, not
        # against `config`, because starting is the thing that must not happen.
        run: |
          set -uo pipefail
          if env -u POSTGRES_PASSWORD -u CODESENTINEL_API_KEYS \
               docker compose $COMPOSE up -d --no-build 2>/dev/null; then
            echo "the production stack started with no credentials configured" >&2
            docker compose $COMPOSE down -v --remove-orphans || true
            exit 1
          fi
          echo "correctly refused"

      - name: Start the production stack behind TLS
        run: |
          CODESENTINEL_DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
          echo "CODESENTINEL_DOCKER_GID=$CODESENTINEL_DOCKER_GID" >> "$GITHUB_ENV"
          CODESENTINEL_DOCKER_GID="$CODESENTINEL_DOCKER_GID" \
            docker compose $COMPOSE up -d --build --wait --wait-timeout 420
          docker compose $COMPOSE ps

      - name: Both API and worker replicas are actually running
        # `replicas: 2` and a published port are mutually exclusive, and nothing caught
        # that while these files were only ever validated rather than started.
        run: |
          set -euo pipefail
          for service in api worker; do
            count="$(docker compose $COMPOSE ps -q "$service" | wc -l)"
            echo "$service replicas running: $count"
            [ "$count" -eq 2 ] || { echo "expected 2 $service replicas, got $count" >&2; exit 1; }
          done
          beat="$(docker compose $COMPOSE ps -q beat | wc -l)"
          # Exactly one, always: two schedulers dispatch every periodic entry twice, and
          # the entry this stack schedules deletes rows.
          [ "$beat" -eq 1 ] || { echo "expected 1 beat, got $beat" >&2; exit 1; }

      - name: Nothing but the proxy is reachable from the host
        # The `!override` removals, checked at runtime rather than in the rendered config.
        # A firewall gap plus a still-published plaintext API is invisible to the
        # application: nothing in it can tell which route a caller took.
        run: |
          set -uo pipefail
          closed=0
          for port in 5432 6379 8000 5173; do
            if timeout 2 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "port $port is published and must not be" >&2
              closed=1
            else
              echo "port $port closed"
            fi
          done
          exit $closed

      - name: TLS terminates and serves the app
        run: |
          set -euo pipefail
          # -k: the certificate is from Caddy's internal CA, which this runner does not
          # trust. What is being checked is that TLS is terminated and routed, not that a
          # public CA signed it -- that part remains unexercised and is said so plainly.
          curl -fsS -k https://localhost/ | grep -qi "<title>"
          echo "https serves the SPA"
          code="$(curl -s -o /dev/null -w '%{http_code}' -k http://localhost/)"
          echo "plain http returns $code"
          case "$code" in 30*) ;; *) echo "http did not redirect to https" >&2; exit 1;; esac

      - name: Authentication is live through the proxy
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' -k -X POST https://localhost/api/v1/scans \
            -H 'Content-Type: application/json' -d '{"url":"https://github.com/psf/requests"}')"
          echo "without a key: $code"
          [ "$code" = "401" ] || { echo "an unauthenticated submission was not refused" >&2; exit 1; }

          code="$(curl -s -o /dev/null -w '%{http_code}' -k -X POST https://localhost/api/v1/scans \
            -H "X-API-Key: $CODESENTINEL_API_KEYS" \
            -H 'Content-Type: application/json' -d '{"url":"ext::sh -c whoami"}')"
          echo "hostile URL with a valid key: $code"
          [ "$code" = "422" ] || { echo "a hostile URL was not refused" >&2; exit 1; }

      - name: Metrics are not published through the proxy
        # Unauthenticated when enabled, so the Caddyfile deliberately does not route it.
        run: |
          set -euo pipefail
          body="$(curl -s -k https://localhost/metrics || true)"
          echo "$body" | head -3
          echo "$body" | grep -q "codesentinel_build_info" && {
            echo "the metrics surface is reachable from outside" >&2; exit 1; }
          echo "not exposed"

      - name: Logs
        if: always()
        run: docker compose $COMPOSE logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose $COMPOSE down -v --remove-orphans
