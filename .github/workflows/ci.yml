name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app/

      # The sandbox image's helper script lives outside the backend package but is still
      # ours, so it is held to the same standard.
      - run: ruff check ../sandbox/
      - run: ruff format --check ../sandbox/

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real PostgreSQL, Redis and Docker. The requires_db and requires_docker tests are
    # the acceptance evidence for the data model, the migrations and constraint C1, so
    # they must actually execute here -- a green run full of skips is not acceptance.
    # CODESENTINEL_REQUIRE_INTEGRATION=1 turns any such skip into a failure.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: codesentinel
          POSTGRES_PASSWORD: codesentinel
          POSTGRES_DB: codesentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codesentinel -d codesentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CODESENTINEL_ENVIRONMENT: ci
      CODESENTINEL_DATABASE_URL: postgresql+asyncpg://codesentinel:codesentinel@localhost:5432/codesentinel_test
      CODESENTINEL_TEST_DATABASE_URL: postgresql+asyncpg://codesentinel:codesentinel@localhost:5432/codesentinel_test
      CODESENTINEL_SANDBOX_IMAGE: codesentinel/analysis:ci
      CODESENTINEL_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build the analysis sandbox image
        # Required before the sandbox tests: the container has no network and cannot
        # pull, so the image has to exist on the runner first.
        working-directory: .
        run: docker build -f sandbox/Dockerfile.analysis -t codesentinel/analysis:ci sandbox/

      - name: Apply migrations
        run: alembic upgrade head

      - name: Record resolved dependency versions
        # The authoritative record of what was actually installed, resolved on the
        # deployment platform rather than on a developer's machine.
        run: pip freeze --exclude-editable > resolved-dependencies.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -rs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-record
          path: |
            backend/coverage.xml
            backend/resolved-dependencies.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # --run, never watch mode: vitest defaults to watching, which in CI is a job that
      # hangs until the runner times out rather than a job that fails.
      - run: npm run test -- --run
      - run: npm run build

  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Substitutes for the local `docker compose up` acceptance criterion, which could
      # not be run on the development machine (no Docker installed). This proves the
      # Dockerfiles and compose file are valid; it does not prove the stack runs.
      # See docs/adr/0005-deferred-docker-verification.md.
      - name: Validate compose file
        run: docker compose config --quiet

      - name: Validate the production overlay
        # The overlay uses `!override` to drop published ports and `${VAR:?}` to refuse
        # default credentials, and neither is exercised by the base file. Without this
        # step nothing checks the file we actually tell people to deploy with -- and a
        # Compose too old for `!override` would fail at deploy time instead of here.
        env:
          POSTGRES_PASSWORD: ci-validation-only
          CODESENTINEL_API_KEYS: ci-validation-only
          CODESENTINEL_CORS_ORIGINS: https://example.invalid
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          # Prove the overlay actually removes the published database port rather than
          # appending to it, which is what a plain `ports: []` would do.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config             | python -c "import sys,yaml; d=yaml.safe_load(sys.stdin);                 p=d['services']['postgres'].get('ports') or [];                 sys.exit(0 if not p else f'postgres still publishes {p}')"

      - name: Refuse to start production without credentials
        # The failure mode this guards is a deployment that silently falls back to the
        # development password published in this repository.
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet 2>/dev/null; then
            echo "production overlay started without required credentials" >&2
            exit 1
          fi
          echo "correctly refused: required variables are unset"

      - name: Build images
        run: docker compose build
