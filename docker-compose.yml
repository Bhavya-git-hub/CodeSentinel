# Local development stack.
#
# NOTE (phase 1): written but not yet verified at runtime -- Docker is not installed on
# the development machine this was built on. `docker compose build` runs in CI, which
# proves the Dockerfiles are valid, but `docker compose up` has not been executed.
# See docs/adr/0005-deferred-docker-verification.md.

name: codesentinel

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: codesentinel
      POSTGRES_PASSWORD: codesentinel
      POSTGRES_DB: codesentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesentinel -d codesentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment: &backend_env
      CODESENTINEL_ENVIRONMENT: local
      CODESENTINEL_DATABASE_URL: postgresql+asyncpg://codesentinel:codesentinel@postgres:5432/codesentinel
      CODESENTINEL_REDIS_URL: redis://redis:6379/0
      CODESENTINEL_CLONE_ROOT: ${CODESENTINEL_CLONE_ROOT:-/var/lib/codesentinel/clones}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: this must report unhealthy while a dependency is down.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    # The worker reaches Docker through the filtering proxy below, never through a
    # mounted socket. See ADR 0013 for the decision and ADR 0015 for exactly what that
    # proxy does and does not stop.
    environment:
      <<: *backend_env
      DOCKER_HOST: tcp://docker-proxy:2375
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    volumes:
      # Cloned target repositories, bind-mounted at the SAME path on both sides.
      #
      # This has to be a host path, not a named volume, and the paths have to match. The
      # worker asks the daemon to start an analysis container with a read-only bind mount
      # of the clone; the daemon runs on the host and resolves that source against the
      # HOST filesystem. With a named volume the path exists only inside the worker, and
      # container creation fails with "bind source path does not exist" -- which is
      # exactly what the first real scan did.
      #
      # Rejected: mounting the whole clones volume into the sandbox by name. It works, and
      # it lets one target's analysis container read every other target's clone. ADR 0009
      # does not trade isolation for convenience, and per-scan mounting is the property
      # being protected here.
      #
      # The directory must exist on the host and be owned by uid 10001 before first start
      # -- a bind mount takes the host's ownership and masks the image's. docs/DEPLOYMENT.md
      # has the command.
      - ${CODESENTINEL_CLONE_ROOT:-/var/lib/codesentinel/clones}:${CODESENTINEL_CLONE_ROOT:-/var/lib/codesentinel/clones}
    healthcheck:
      # Asks this worker specifically, by the name Celery registers it under. A bare
      # `celery inspect ping` answers if ANY worker replies, so a dead replica in a pool
      # of two would report itself healthy on its neighbour's answer.
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$(hostname) >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    # The periodic scheduler. Exactly one replica, always -- two beats sharing a schedule
    # dispatch every periodic entry twice, and the entry scheduled here deletes rows.
    # It runs no work itself; it only puts messages on the queue the workers read, which
    # is why it needs neither the clones volume nor a route to the Docker proxy.
    build:
      context: ./backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment:
      <<: *backend_env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  docker-proxy:
    # Holds the Docker socket so the worker does not, and validates the BODY of every
    # request rather than only its path. An off-the-shelf endpoint proxy cannot do that,
    # which is what ADR 0015 recorded as owed and ADR 0017 closes.
    build:
      context: ./backend
    command:
      - uvicorn
      - app.proxy:app
      - --host
      - 0.0.0.0
      - --port
      - "2375"
    environment:
      CODESENTINEL_ENVIRONMENT: local
    # The socket is root:docker mode 660, and this image runs as uid 10001. Without
    # membership of that group the proxy starts cleanly and returns 500 to every request
    # for the life of the deployment -- which is exactly what the first real
    # `docker compose up` did. It now refuses to start instead, so a wrong gid here is a
    # container that will not boot rather than a stack that looks up and analyses nothing.
    #
    # group_add rather than `user: root`: this is the one process holding the daemon, and
    # group membership is the least privilege that lets it read the socket. The gid is not
    # portable between hosts -- read it with:
    #
    #     stat -c '%g' /var/run/docker.sock
    #
    # 999 is the common Debian/Ubuntu value and is a starting guess, not a safe default.
    group_add:
      - "${CODESENTINEL_DOCKER_GID:-999}"
    volumes:
      # The only mount of the socket anywhere in this stack.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    # Demo mode is deliberately NOT set here. A running stack has a real API, and
    # serving fixtures beside it would be the silent fallback the data layer forbids.

volumes:
  pgdata:
  # No `clones` volume: see the worker's bind mount above for why it cannot be one.
