server {
  listen 80;
  root /usr/share/nginx/html;

  # The API, on the same origin as the page.
  #
  # Without this, the bundle's relative /api/v1/... request lands on the SPA fallback
  # below and comes back as index.html with a 200. The client then fails parsing JSON,
  # which surfaces as a syntax error rather than as "the API is not reachable" -- the
  # least informative possible symptom of a perfectly ordinary misconfiguration.
  #
  # Same-origin is also what keeps CORS out of the picture entirely: no preflight, and
  # no cross-origin credential for another site to borrow.
  location /api/ {
    # Docker's embedded DNS, with the upstream held in a variable so nginx resolves it
    # per request rather than at start-up. With a literal `proxy_pass http://api:8000`,
    # nginx refuses to start when that name does not resolve -- so running this image on
    # its own, or starting it before the API, would fail as a container that will not
    # boot. Deferred resolution turns the same situation into a 502 on one request,
    # which says what is actually wrong.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A scan submission returns immediately, but the report on a large repository is
    # assembled from several aggregate queries. The default 60s is tight enough to cut
    # one off and report it as a gateway error.
    proxy_read_timeout 120s;
  }

  location /health {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $health_upstream http://api:8000;
    proxy_pass $health_upstream;
  }

  # Single-page app: unknown paths must return index.html, or refreshing on
  # /scans/<id> would 404 against a route that only exists in the browser.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
